version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      docs-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Australia/Sydney
    open-pull-requests-limit: 3
