name: Build Docker Image

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: docker-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected vX.Y.Z, got $TAG"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set image names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          images="ghcr.io/${owner}/unihomelabdash"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="${images},docker.io/${DOCKERHUB_USERNAME}/unihomelabdash"
            echo "DOCKERHUB_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "DOCKERHUB_ENABLED=false" >> "$GITHUB_ENV"
          fi
          echo "IMAGES=${images}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=UniHomelabDash
            org.opencontainers.image.description=A self-hosted mobile-first homelab dashboard PWA.
            org.opencontainers.image.source=https://github.com/uniskela/UniHomelabDash
            org.opencontainers.image.documentation=https://github.com/uniskela/UniHomelabDash#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Uniskela
            org.opencontainers.image.url=https://github.com/uniskela/UniHomelabDash

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
