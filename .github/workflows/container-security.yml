name: Container security

on:
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/container-security.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/container-security.yml
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build final image
        run: docker build --tag unihomelabdash-security:${{ github.sha }} .

      - name: Record vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: unihomelabdash-security:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Show application high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: unihomelabdash-security:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ github.sha }}
          path: trivy.json
          if-no-files-found: error
          retention-days: 14

      - name: Gate on fixable high and critical OS findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: unihomelabdash-security:${{ github.sha }}
          scanners: vuln
          vuln-type: os
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
